name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Bundle size budgets
        run: node scripts/check-size.mjs
      - name: Package contents (publint)
        if: matrix.node == 22
        run: |
          pnpm dlx publint@0.3 packages/grabby
          pnpm dlx publint@0.3 packages/server
      - name: Type resolution (are-the-types-wrong)
        if: matrix.node == 22
        working-directory: packages/grabby
        run: >
          pnpm dlx @arethetypeswrong/cli@0.18 --pack . --profile node16
          --exclude-entrypoints ./builder ./dist/builder/builders/application/index
          ./dist/builder/builders/dev-server/index ./builders.json ./package.json
          ./global ./loader ./react ./angular

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
