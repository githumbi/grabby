name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for what it needs. Third-party actions
# are pinned to full commit SHAs (a moved tag can't change what runs), and
# Dependabot keeps the SHAs and version comments up to date.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Dependency install scripts are blocked and brand-new releases are
      # refused by pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Bundle size budgets
        run: node scripts/check-size.mjs
      - name: Package contents (publint)
        if: matrix.node == 22
        run: |
          pnpm exec publint packages/grabby
          pnpm exec publint packages/server
      - name: Type resolution (are-the-types-wrong)
        if: matrix.node == 22
        run: >
          pnpm exec attw --pack packages/grabby --profile node16
          --exclude-entrypoints ./builder ./dist/builder/builders/application/index
          ./dist/builder/builders/dev-server/index ./builders.json ./package.json
          ./global ./loader ./react ./angular

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  zizmor:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
