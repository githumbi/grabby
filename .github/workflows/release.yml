name: Release

# Publishes with npm trusted publishing (OIDC): no npm token is stored in
# this repository. Each package is configured once on npmjs.com under
# Settings → Trusted publishing → GitHub Actions, with this repository and
# the workflow file name `release.yml`. Provenance is attached automatically.
#
# Hardening (see SECURITY.md): building and testing run third-party code, so
# they happen in a job that can't publish. The publish job gets the built
# files, has the OIDC permission, and restores no caches, so a poisoned
# cache or a compromised build tool can't reach the publishing token.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'githumbi/grabby'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-size.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          # Everything `pnpm build` produces, including the README and
          # LICENSE copies the packages ship.
          path: |
            packages/grabby/dist
            packages/grabby/README.md
            packages/grabby/LICENSE
            packages/server/dist
            packages/server/LICENSE
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # version commits and tags
      pull-requests: write  # the "Version packages" PR
      id-token: write       # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm 11.5.1+, which Node 24.5+ bundles,
          # so npm doesn't have to be installed separately.
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      # Only the Changesets CLI is needed here; dependency install scripts
      # stay blocked by pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Open a version PR, or publish once it's merged
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'Version packages'
          pr-title: 'Version packages'
