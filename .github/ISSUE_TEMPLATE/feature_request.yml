name: Feature request
description: An idea to make Grabby better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      options: [Developers using Grabby locally, Reviewers leaving feedback on a live site, Both]
